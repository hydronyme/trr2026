<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<style>
#on_off_button {
	width: 45%;
	height:100px;
}
#auto_manu_button {
	width: 45%;
	height:100px;
}

datalist {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  writing-mode: vertical-lr;
  width: 100%;
}

option {
  padding: 0;
}

input[type="range"] {
  width: 100%;
  height:50px;
  margin: 0;
}
</style>
<script>
var engine;

function init() {
	vmax=0;
	engine=0;
	document.getElementById("on_off_button").innerHTML="Engine Off";
	document.getElementById("on_off_button").style.backgroundColor="red";

    document.getElementById("on_off_button").addEventListener("click",async function() {
        let response;
        if(this.innerHTML == "Engine Off") {
            response = await fetch('/engine_on');
            this.innerHTML = "Engine On";
            this.style.backgroundColor="green";
            engine=1;
        }	
        else {
            response = await fetch('/engine_off');
            this.innerHTML = "Engine Off";
            this.style.backgroundColor="red";
            engine=0;
        }	
    });
}

function updateData() {
    fetch('/brain')
        .then(response => response.json())
        .then(data => {
            document.getElementById('angle').textContent = data.angle;
            document.getElementById('odometre').textContent = data.odometre;
            document.getElementById('rpm').textContent = data.current_rpm;
            document.getElementById('pwm').textContent = data.current_pwm;
        });
}

setInterval(updateData, 500); // toutes les 500

    </script>
    <body onload="init()">
        <img style="-webkit-user-select: none;" src="/camera" width="100%">
        <BR>
        <button id="on_off_button"></button>
        <div>
            angle : <span id="angle">--</span><br>
            odometre : <span id="odometre">--</span><br>
            rpm : <span id="rpm">--</span><br>
            pwm : <span id="pwm">--</span><br>
        </div>
    </body>		 
    </html>
